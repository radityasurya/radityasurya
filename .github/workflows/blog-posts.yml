name: Update latest blog posts

on:
  schedule:
    - cron: "23 4 * * *" # daily, off the top of the hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://radityasurya.com/rss.xml"
          max_post_count: "5"
          commit_message: "chore: refresh latest posts [skip ci]"
